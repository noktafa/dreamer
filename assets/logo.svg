<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed" stop-opacity="0.3"/>
      <stop offset="50%" style="stop-color:#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#e879f9" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bgGrad)"/>

  <!-- Constellation / infrastructure nodes -->
  <!-- Connection lines -->
  <line x1="95" y1="75" x2="140" y2="100" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="100" x2="130" y2="135" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="140" y1="100" x2="185" y2="85" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="185" y1="85" x2="195" y2="125" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="130" y1="135" x2="195" y2="125" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.4"/>
  <line x1="95" y1="75" x2="110" y2="50" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.3"/>
  <line x1="185" y1="85" x2="210" y2="60" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Nodes (representing 7 servers) -->
  <circle cx="95" cy="75" r="5" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="140" cy="100" r="6" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="130" cy="135" r="4" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="185" cy="85" r="5" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="195" cy="125" r="4.5" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="110" cy="50" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="210" cy="60" r="3.5" fill="#a78bfa" opacity="0.5"/>

  <!-- Orbiting particle ring around center node -->
  <ellipse cx="140" cy="100" rx="30" ry="12" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.25" transform="rotate(-20 140 100)"/>

  <!-- Main text -->
  <text x="270" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="url(#textGrad)" letter-spacing="8" filter="url(#softGlow)">dreamer</text>

  <!-- Subtitle -->
  <text x="275" y="148" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b8ba7" letter-spacing="4" text-transform="uppercase">INFRASTRUCTURE INTELLIGENCE</text>

  <!-- Decorative line under subtitle -->
  <line x1="275" y1="158" x2="545" y2="158" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Small accent dots -->
  <circle cx="60" cy="160" r="1.5" fill="#7c3aed" opacity="0.3"/>
  <circle cx="750" cy="40" r="2" fill="#a78bfa" opacity="0.2"/>
  <circle cx="720" cy="165" r="1.5" fill="#c084fc" opacity="0.25"/>
  <circle cx="45" cy="45" r="1" fill="#e879f9" opacity="0.2"/>
</svg>
